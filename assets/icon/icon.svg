<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <!--
    Mind 应用图标
    - 底色：XMind 同款红色垂直渐变（顶部 #FA4A1E → 底部 #F7061E）
    - 图形：白色字母 M，笔画锥形收窄（腿端 66 → 谷底 104），转折处圆角过渡，
            填充为白到浅粉的渐变（#FFFFFF → #FFD2C7）
    - 改色改形只改这一个文件，然后执行：
      cd desktop && npx tauri icon ../assets/icon/icon.svg
  -->
  <defs>
    <linearGradient id="bg" x1="512" y1="80" x2="512" y2="944" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FA4A1E"/>
      <stop offset="1" stop-color="#F7061E"/>
    </linearGradient>
    <linearGradient id="ink" x1="253" y1="253" x2="771" y2="771" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFD2C7"/>
    </linearGradient>
  </defs>
  <rect x="80" y="80" width="864" height="864" rx="196" fill="url(#bg)"/>
  <path fill="url(#ink)" d="M 267.00 724.00 L 333.00 724.00 L 346.00 300.00 L 254.00 300.00 Z M 337.57 273.45 L 262.43 326.55 L 469.53 630.01 L 554.47 569.99 Z M 469.53 569.99 L 554.47 630.01 L 761.57 326.55 L 686.43 273.45 Z M 770.00 300.00 L 678.00 300.00 L 691.00 724.00 L 757.00 724.00 Z M 267.00 724.00 a 33.00 33.00 0 1 0 66.00 0 a 33.00 33.00 0 1 0 -66.00 0 Z M 254.00 300.00 a 46.00 46.00 0 1 0 92.00 0 a 46.00 46.00 0 1 0 -92.00 0 Z M 460.00 600.00 a 52.00 52.00 0 1 0 104.00 0 a 52.00 52.00 0 1 0 -104.00 0 Z M 678.00 300.00 a 46.00 46.00 0 1 0 92.00 0 a 46.00 46.00 0 1 0 -92.00 0 Z M 691.00 724.00 a 33.00 33.00 0 1 0 66.00 0 a 33.00 33.00 0 1 0 -66.00 0 Z"/>
