name: Feature request
description: Suggest a new capability or an improvement
title: '[Feature] '
labels: ['enhancement', 'needs triage']
body:
  - type: markdown
    attributes:
      value: |
        One request per issue, please — bundled requests are hard to prioritise. For usage questions, check the README first.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched the open and closed issues and this is not a duplicate.
          required: true
        - label: This is one request, not several unrelated ideas in one issue.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation where the current version lets you down. Concrete examples help more than general wishes.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: The behaviour you have in mind. Sketches, screenshots and mock-ups are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried or considered
      description: Other tools, workarounds, or a smaller change that would also solve the problem.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor UI
        - Desktop app
        - Import / export
        - AI features
        - Build and tooling
        - Documentation
        - Other
    validations:
      required: true
