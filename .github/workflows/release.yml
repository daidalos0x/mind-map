name: Release desktop app

# 推送 v* tag 时自动构建并发布；也可以在 Actions 页面手动填 tag 重跑。
#
# 只发布 Windows / Linux：这两个平台不签名也能直接运行，用户不必自己准备
# MSVC + WebView2 或 WebKitGTK 开发包。macOS 用户走仓库里的 `make`，
# 本地编译后装进 ~/Applications，完全绕开 Gatekeeper 和公证。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v0.2.0）'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # 构建和发布两处都要算 tag，统一放在这里，避免表达式各写一遍
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: nsis
            artifact: windows
          # 用 22.04 而不是 latest：glibc 基线压到 2.35，新发行版向下兼容；
          # 也是第一个带 webkit2gtk-4.1 的 LTS，Tauri v2 需要它
          - name: linux
            os: ubuntu-22.04
            bundles: deb,appimage
            artifact: linux
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 手动触发时默认只取分支，这里显式取 tag，保证打出来的包版本号对得上
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # 格式不对就别打包了，早失败比发布一个风格不一致的构建便宜
      - name: Check rust formatting
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # vue-cli 4 的传递依赖会刷几十条 deprecated / EBADENGINE 警告，
      # 这些只能靠迁移整条构建链消除，安装时只保留错误输出
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund --loglevel=error

      # 放在 npm ci 之后：它会改 web/package.json 的 version，避免和 lockfile 的校验撞上。
      # 用 GitHub 表达式而不是 ${VAR}：Windows runner 默认是 pwsh，读不到 bash 风格的变量
      - name: Sync version into manifests
        run: node scripts/sync-version.mjs "${{ env.RELEASE_TAG }}"

      # tauri build 会先跑 beforeBuildCommand（desktop/prepare-dist.mjs），
      # 把 web 产物打包进 desktop-dist 再编译；--bundles 覆盖 tauri.conf 里的 targets，
      # 因为配置里的 "app" 是 macOS 专用的产物类型
      - name: Build bundles
        working-directory: desktop
        env:
          CI: true
          # Runner 里没有 FUSE 时，linuxdeploy / appimagetool 需要自解压才能跑
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p out
          find desktop/src-tauri/target/release/bundle -type f \
            \( -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) -exec cp {} out/ \;
          ls -lh out
          test -n "$(ls -A out)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -lh dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Mind ${{ env.RELEASE_TAG }}
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            🎉 A lightweight, minimal, and customizable mind map.

            Install instructions are in the [README](https://github.com/phaethix/mind-map#install).
