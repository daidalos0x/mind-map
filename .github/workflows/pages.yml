name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      # 格式不对就不部署，省得线上是一份没格式化的构建
      - name: Check formatting
        run: npm run format:check

      # vue-cli 4 的传递依赖（webpack 4、request、svgo 1.x、Vue 2 等）会刷几十条
      # deprecated / EBADENGINE 警告，这些只能靠迁移整条构建链消除，
      # 所以安装阶段只保留错误输出，和 Makefile 里的写法一致。
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Build web app
        working-directory: web
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p site/dist
          cp index.html site/index.html
          cp -R dist/. site/dist/
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
