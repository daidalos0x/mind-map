name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      # 格式不对就不部署，省得线上是一份没格式化的构建
      - name: Check formatting
        run: npm run format:check

      # 剩下的 deprecated 提示来自 eslint 8 那条链（glob 7、rimraf 3 等），
      # 属于上游工具版本上限，装依赖时只保留错误输出，和 Makefile 的写法一致。
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Build web app
        working-directory: web
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p site/dist
          cp index.html site/index.html
          cp -R dist/. site/dist/
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
